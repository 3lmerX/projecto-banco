server.port=${PORT:8082}
spring.application.name=servico-transaccoes
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/banco_transacoes_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
server.error.include-message=always
server.error.include-stacktrace=never
contas.url=${CONTAS_URL:http://localhost:8081}
auditoria.url=${AUDITORIA_URL:http://localhost:8084}
internal.api-key=${INTERNAL_API_KEY:chave-interna-de-desenvolvimento-2026}
jwt.secret=${JWT_SECRET:minhaChaveSuperSecretaParaOProjectoDoBancoDigital2026}
banco.nome=${BANCO_NOME:[NOME_DO_BANCO]}
