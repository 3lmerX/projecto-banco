server.port=${PORT:8080}
spring.application.name=banco-gateway

spring.cloud.gateway.routes[0].id=servico-autenticacao
spring.cloud.gateway.routes[0].uri=${AUTH_URL:http://localhost:8083}
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[1].id=servico-transaccoes
spring.cloud.gateway.routes[1].uri=${TRANSACOES_URL:http://localhost:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/transferencias/**,/contas/*/depositos,/contas/*/movimentos

spring.cloud.gateway.routes[2].id=servico-auditoria
spring.cloud.gateway.routes[2].uri=${AUDITORIA_URL:http://localhost:8084}
spring.cloud.gateway.routes[2].predicates[0]=Path=/auditoria/**

spring.cloud.gateway.routes[3].id=servico-contas
spring.cloud.gateway.routes[3].uri=${CONTAS_URL:http://localhost:8081}
spring.cloud.gateway.routes[3].predicates[0]=Path=/clientes/**,/contas/**

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173,http://localhost:3000,${CORS_ORIGINS:}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=Authorization,Content-Type
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=false

jwt.secret=${JWT_SECRET:minhaChaveSuperSecretaParaOProjectoDoBancoDigital2026}
server.error.include-message=always
server.error.include-stacktrace=never
