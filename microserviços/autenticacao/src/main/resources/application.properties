server.port=${PORT:8083}
spring.application.name=servico-autenticacao
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/banco_auth_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
contas.url=${CONTAS_URL:http://localhost:8081}
auditoria.url=${AUDITORIA_URL:http://localhost:8084}
internal.api-key=${INTERNAL_API_KEY:chave-interna-de-desenvolvimento-2026}
jwt.secret=${JWT_SECRET:minhaChaveSuperSecretaParaOProjectoDoBancoDigital2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
banco.nome=${BANCO_NOME:[NOME_DO_BANCO]}
app.seed.admin-email=${ADMIN_EMAIL:admin@banco.mz}
app.seed.admin-password=${ADMIN_PASSWORD:}
server.error.include-message=always
server.error.include-stacktrace=never
